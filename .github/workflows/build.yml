#
# Builds the application package with ufbt and runs the firmware's own linter
# over the sources. The release channel is the one the application is written
# against: it links the firmware's mbed TLS, so a build for one API version
# will not load on another.

name: build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fap:
    name: FAP, release channel
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build with ufbt
        id: build
        uses: flipperdevices/flipperzero-ufbt-action@e7cd34914e61ddc056acd8daaab96d8b4d4d9f55 # v0.1.4
        with:
          sdk-channel: release

      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emrtd-${{ steps.build.outputs.suffix }}
          path: ${{ steps.build.outputs.fap-artifacts }}
          if-no-files-found: error

      # The host suite compiles mbed TLS with a copy of the firmware's own
      # configuration, which is the whole reason its results say anything
      # about the device. This job is the only one with an SDK deployed, so it
      # is the only place the copy can be compared with the real thing. The day
      # the firmware enables another curve or another cipher this fails, and
      # the copy is refreshed deliberately rather than drifting unnoticed.
      #
      # STRICT=1 because here a missing SDK means the step compared nothing,
      # and a check that compares nothing must not report success.
      - name: Compare the vendored mbed TLS configuration with the SDK
        run: make -C tests/host config-drift STRICT=1

      # "ufbt lint" is lint.py from the SDK: clang-format over every .c and .h
      # under the application directory, plus the file naming and permission
      # conventions. It walks tests/ as well - it skips only "lib" and hidden
      # directories - so the host suite is held to the same style as the
      # application.
      - name: Lint the sources
        uses: flipperdevices/flipperzero-ufbt-action@e7cd34914e61ddc056acd8daaab96d8b4d4d9f55 # v0.1.4
        with:
          skip-setup: true
          task: lint
