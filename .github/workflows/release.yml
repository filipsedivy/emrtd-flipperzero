#
# On a v* tag: run the host suites, build the package against the release
# channel, and attach it to a GitHub release. The tests run first because a
# release that cannot pass its own vector tests has no business being
# published.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: host suites
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make the ASLR entropy fit the sanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Run the suites
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: make -C tests/host test

  release:
    name: build and publish
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build with ufbt
        id: build
        uses: flipperdevices/flipperzero-ufbt-action@e7cd34914e61ddc056acd8daaab96d8b4d4d9f55 # v0.1.4
        with:
          sdk-channel: release

      - name: Publish the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ steps.build.outputs.fap-artifacts }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Built against the official firmware release channel,
            API ${{ steps.build.outputs.api-version }}.

            A package links the firmware's own mbed TLS, so it loads on the
            firmware it was built for. Copy the .fap to /ext/apps/NFC/ on the
            SD card, or install it with `ufbt launch`.

            The changelog is in .catalog/changelog.md.
